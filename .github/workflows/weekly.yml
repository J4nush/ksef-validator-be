name: weekly

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build base image without cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: base
          tags: ksef-validator-base:scan
          load: true
          no-cache: true

      - name: Fail on fixable vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.trivyignore:/scan/.trivyignore:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed
          --ignorefile /scan/.trivyignore
          ksef-validator-base:scan

      - name: Report unfixed vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.trivyignore:/scan/.trivyignore:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --severity CRITICAL,HIGH --exit-code 0
          --ignorefile /scan/.trivyignore
          ksef-validator-base:scan

  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned schema source with CIRFMF/ksef-api
        run: scripts/check-mf-upstream.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  mf-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev image without cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: dev
          tags: ksef-validator-php:latest
          load: true
          no-cache: true

      - name: Install dependencies
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app/packages/ksef-fa3-validator ksef-validator-php composer install --no-interaction --no-progress

      - name: Download MF samples
        run: scripts/fetch-mf-samples.sh

      - name: Validate MF samples without network
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app/packages/ksef-fa3-validator ksef-validator-php vendor/bin/pest --group=mf-samples
