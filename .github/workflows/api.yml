name: api

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: dev
          tags: ksef-validator-php:latest
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: Validate composer.json
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app ksef-validator-php composer validate --strict

      - name: Install dependencies
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app ksef-validator-php composer install --no-interaction --no-progress

      - name: Lint
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app ksef-validator-php composer lint

      - name: Static analysis
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app ksef-validator-php composer analyse

      - name: Tests
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app ksef-validator-php vendor/bin/pest

      - name: Mutation tests
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/app" -w /app ksef-validator-php vendor/bin/pest --mutate --parallel --min=85

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          tags: ksef-validator-api:local
          load: true
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max

      - name: Smoke test under Octane
        run: scripts/smoke-api.sh
        env:
          SKIP_BUILD: 1

      - name: Scan prod image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.trivyignore:/scan/.trivyignore:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed
          --ignorefile /scan/.trivyignore
          ksef-validator-api:local
