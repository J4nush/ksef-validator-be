name: ksef-validator

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - .:/app
    working_dir: /app

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: ksef-validator-api:local
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-1000}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/storage/framework:size=4m,uid=10001,gid=999
      - /config:size=4m,uid=10001,gid=999
      - /data:size=4m,uid=10001,gid=999
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../frontend
    image: ksef-validator-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    volumes:
      - ../frontend/docker/nginx/dev-api.conf:/etc/nginx/dev/api.conf:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=8m
    mem_limit: 32m
